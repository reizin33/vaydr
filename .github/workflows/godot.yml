# VAYDR no Godot (protótipo): importa o projeto da pasta godot/, roda o teste automático sem tela, tira as fotos de
# conferência num Linux sem placa de vídeo (no modo leve, com o OpenGL por software; e as do modo completo, o Forward+,
# com o Vulkan por software) e monta o .exe do Windows.
# - Roda sozinho a cada envio que mexe em godot/ no ramo correcoes-10-2-2 (só monta, testa e fotografa).
# - Rodar à mão com uma versão (ex.: 0.1.0) também publica o .exe como pré-lançamento "godot-v0.1.0".
# Segurança: as ações ficam presas a um commit; a montagem só lê o repositório; só o job de publicar escreve.
name: VAYDR Godot (protótipo)

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão do protótipo para publicar (ex.: 0.1.0). Vazio = só monta e testa"
        required: false
        default: ""
      fotos:
        description: "Tirar as fotos de conferência (demora uns 20 min no Linux sem placa de vídeo)"
        type: boolean
        default: true
  push:
    branches: [correcoes-10-2-2]
    paths: ["godot/**", ".github/workflows/godot.yml"]

permissions:
  contents: read


env:
  GODOT_VER: "4.7.2"

jobs:
  # os testes num job só deles: o registro sai em uns 3 minutos (as fotos e o .exe vêm no job de montar, depois)
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      abriu: ${{ steps.teste.outputs.abriu }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Godot e modelos de exportação
        run: |
          set -e
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libxcursor1 libxinerama1 libxrandr2 libxi6 libfontconfig1 > /dev/null
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VER}-stable_linux.x86_64.zip"
          curl -sSfL -o modelos.tpz "$base/Godot_v${GODOT_VER}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VER}-stable_linux.x86_64" godot-bin
          chmod +x godot-bin
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VER}.stable"
          mkdir -p "$dest"
          unzip -q -j modelos.tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/version.txt" -d "$dest"
          ls -la "$dest"

      - name: Importar o projeto
        run: |
          ./godot-bin --headless --path godot --import 2>&1 | tee importar.log | tail -40
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed" importar.log; then echo "erros na importação"; fi

      # a saída vai inteira para o arquivo; no registro aparece cada linha uma vez só (erro repetido não enche o registro)
      - name: Teste sem tela
        id: teste
        run: |
          set +e
          # erro de script na importação: o jogo nem abre (sem isso o teste ficava 10 minutos parado esperando)
          if grep -q -E "SCRIPT ERROR|Parse Error" importar.log; then
            grep -E "SCRIPT ERROR|Parse Error|at: " importar.log | awk '!visto[$0]++' | head -24 | while IFS= read -r l; do echo "::error title=Importação::${l//%/%25}"; done
            exit 1
          fi
          timeout 600 ./godot-bin --headless --path godot -- --teste 2>&1 | tee teste.log | awk '!visto[$0]++ && n++ < 600'
          echo "----- resumo -----"
          grep -E "^(ok |FALHA|TESTE|mapa:)" teste.log
          # o jogo abriu (os scripts compilaram e o mapa montou): as fotos valem a pena mesmo se alguma conferência falhou
          if grep -q "TESTE VAYDR Godot: começo" teste.log; then echo sim > jogo_abriu; echo "abriu=sim" >> "$GITHUB_OUTPUT"; fi
          # as falhas e os erros de script viram anotações da execução (dá para ler antes de as fotos acabarem)
          grep -E "^FALHA|^TESTE FALHOU|SCRIPT ERROR|Parse Error|Invalid |at: " teste.log | awk '!visto[$0]++' | head -24 | while IFS= read -r l; do echo "::error title=Teste::${l//%/%25}"; done
          grep -q "TESTE OK" teste.log

      # a partida em rede de verdade: dois jogos neste computador, quem abre e quem entra (cada um confere o seu lado)
      - name: Teste da rede (dois jogos)
        if: ${{ always() }}
        run: |
          set +e
          if [ ! -f jogo_abriu ]; then echo "o jogo nem abriu no teste (erro de script?): sem o teste da rede"; exit 1; fi
          timeout 480 ./godot-bin --headless --path godot -- --teste-rede anfitriao > rede_anf.log 2>&1 &
          A=$!
          sleep 4
          timeout 470 ./godot-bin --headless --path godot -- --teste-rede convidado > rede_conv.log 2>&1
          wait $A
          for f in rede_anf.log rede_conv.log; do echo "===== $f ====="; awk '!visto[$0]++ && n++ < 250' "$f"; done
          echo "----- resumo -----"
          grep -h -E "^(ok |FALHA|TESTE)" rede_anf.log rede_conv.log
          grep -h -E "^FALHA|TESTE REDE.*FALHOU|SCRIPT ERROR|Parse Error|Invalid |at: " rede_anf.log rede_conv.log | awk '!visto[$0]++' | head -24 | while IFS= read -r l; do echo "::error title=Rede::${l//%/%25}"; done
          grep -q "TESTE REDE ANFITRIAO OK" rede_anf.log && grep -q "TESTE REDE CONVIDADO OK" rede_conv.log

      # os registros dos testes saem logo (dá para ler enquanto as fotos ainda estão sendo tiradas)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: testes
          path: |
            importar.log
            teste.log
            rede_anf.log
            rede_conv.log
          if-no-files-found: ignore
          retention-days: 5


  montar:
    needs: testes
    if: ${{ always() }}
    # só o job de montar espera o anterior sair (os testes de um envio novo começam na hora)
    concurrency:
      group: godot-montar-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Godot e modelos de exportação
        run: |
          set -e
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libxcursor1 libxinerama1 libxrandr2 libxi6 libfontconfig1 > /dev/null
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VER}-stable_linux.x86_64.zip"
          curl -sSfL -o modelos.tpz "$base/Godot_v${GODOT_VER}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VER}-stable_linux.x86_64" godot-bin
          chmod +x godot-bin
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VER}.stable"
          mkdir -p "$dest"
          unzip -q -j modelos.tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/version.txt" -d "$dest"
          ls -la "$dest"

      - name: Importar o projeto
        run: |
          ./godot-bin --headless --path godot --import 2>&1 | tee importar.log | tail -40
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed" importar.log; then echo "erros na importação"; fi

      - name: Fotos (modo leve, OpenGL por software)
        if: ${{ always() && (github.event_name == 'push' || inputs.fotos) }}
        env:
          ABRIU: ${{ needs.testes.outputs.abriu }}
        run: |
          set +e
          if [ "$ABRIU" != "sim" ]; then echo "o jogo nem abriu no teste (erro de script?): sem fotos"; exit 0; fi
          export LIBGL_ALWAYS_SOFTWARE=1
          # o amigo das fotos da partida em rede (outro jogo, sem tela): entra na partida que o jogo das fotos abre no fim
          timeout 3900 ./godot-bin --headless --path godot -- --fotos-rede convidado > rede_fotos.log 2>&1 &
          timeout 3900 xvfb-run -a -s "-screen 0 1280x720x24" ./godot-bin --path godot --rendering-driver opengl3 --resolution 1280x720 -- --fotos 2>&1 | tee fotos.log | awk '!visto[$0]++ && n++ < 400'
          sleep 2
          kill %1 2>/dev/null
          echo "===== amigo das fotos ====="
          awk '!visto[$0]++ && n++ < 120' rede_fotos.log
          ls -la godot/fotos || true

      # as fotos saem no próprio registro (em base64), para conferir sem baixar o artefato
      - name: Fotos no registro
        if: ${{ always() && (github.event_name == 'push' || inputs.fotos) }}
        run: |
          for f in godot/fotos/*.jpg; do
            [ -f "$f" ] || continue
            echo "FOTO-INICIO $(basename "$f") $(stat -c %s "$f")"
            base64 -w 3000 "$f" | sed 's/^/FOTO|/'
            echo "FOTO-FIM $(basename "$f")"
          done

      - name: Exportar para Windows
        if: always()
        run: |
          set +e
          mkdir -p out
          ./godot-bin --headless --path godot --export-release "Windows Desktop" ../out/VAYDR-prototipo.exe 2>&1 | tee exportar.log | tail -30
          ls -la out
          echo "----- o que mais pesa no pacote -----"
          du -ak godot/.godot/imported | sort -n | tail -25
          du -sk godot/.godot/imported

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: godot-prototipo
          path: |
            out/
            godot/fotos/
            importar.log
            rede_fotos.log
            fotos.log
            exportar.log
          retention-days: 14

  # o modo de desenho completo (Forward+, o padrão do jogo): as fotos com o Vulkan por software (lavapipe), num job à parte
  # (as fotos de conferência do job de montar saem no modo leve, com o OpenGL por software). Erro de shader no Vulkan
  # aparece aqui e segura a publicação.
  desenho:
    needs: testes
    if: ${{ always() && needs.testes.outputs.abriu == 'sim' && (github.event_name == 'push' || inputs.fotos) }}
    concurrency:
      group: godot-desenho-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Godot e o Vulkan por software
        run: |
          set -e
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools libxcursor1 libxinerama1 libxrandr2 libxi6 libfontconfig1 > /dev/null
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VER}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VER}-stable_linux.x86_64" godot-bin
          chmod +x godot-bin
          vulkaninfo --summary 2>&1 | head -40 || true

      - name: Importar o projeto
        run: |
          ./godot-bin --headless --path godot --import 2>&1 | tee importar.log | tail -20

      - name: Fotos do modo completo (Vulkan por software)
        run: |
          set +e
          timeout 2700 xvfb-run -a -s "-screen 0 1280x720x24" ./godot-bin --path godot --rendering-driver vulkan --resolution 1280x720 -- --fotos-desenho 2>&1 | tee desenho.log | awk '!visto[$0]++ && n++ < 300'
          echo "----- erros (shader, script, motor) -----"
          grep -E "SHADER ERROR|SCRIPT ERROR|Parse Error|ERROR:" desenho.log | awk '!visto[$0]++' | head -40
          grep -E "SHADER ERROR|SCRIPT ERROR|Parse Error" desenho.log | awk '!visto[$0]++' | head -12 | while IFS= read -r l; do echo "::error title=Desenho completo::${l//%/%25}"; done
          ls -la godot/fotos || true
          grep -q "FOTOS-DESENHO OK" desenho.log && ! grep -q -E "SHADER ERROR|SCRIPT ERROR|Parse Error" desenho.log

      - name: Fotos no registro
        if: always()
        run: |
          for f in godot/fotos/*.jpg; do
            [ -f "$f" ] || continue
            echo "FOTO-INICIO $(basename "$f") $(stat -c %s "$f")"
            base64 -w 3000 "$f" | sed 's/^/FOTO|/'
            echo "FOTO-FIM $(basename "$f")"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fotos-modo-completo
          path: |
            godot/fotos/
            importar.log
            desenho.log
          retention-days: 14

  publicar:
    # só publica com os testes, a montagem e as fotos do modo completo (quando tiradas) certos
    needs: [testes, montar, desenho]
    if: ${{ !cancelled() && inputs.versao != '' && needs.testes.result == 'success' && needs.montar.result == 'success' && (needs.desenho.result == 'success' || needs.desenho.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: godot-prototipo
      - name: Publicar pré-lançamento
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          set -e
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "versão inválida"; exit 1; fi
          cp out/VAYDR-prototipo.exe "VAYDR-Godot-$VERSAO.exe"
          gh release create "godot-v$VERSAO" "VAYDR-Godot-$VERSAO.exe" -R "$REPO" --target "$REF" --prerelease \
            --title "VAYDR no Godot $VERSAO (protótipo)" --notes "Protótipo do VAYDR refeito no Godot: baixe o .exe e rode (não instala nada)."
